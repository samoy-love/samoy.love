name: CI

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

# Новый пуш в PR делает предыдущий прогон на этой же ветке бессмысленным —
# его результат никто не увидит раньше, чем досчитает свежий. Отменяем сразу,
# а не ждём финиша: то же правило, что в coverage.yml, только там group не
# отменяемый на main, а здесь ветка PR отменяема всегда.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права для GITHUB_TOKEN: CI только читает код. Без этого блока
# действуют настройки репозитория, и любой шаг (включая сторонние actions)
# получает тот токен, который там выставлен.
permissions:
  contents: read

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          # Событие всегда pull_request (см. блок on:), поэтому диапазон один:
          # то, что ветка добавляет к своей базе.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Активная LTS (24 «Krypton»). Node 22 ушёл в maintenance —
          # ловить его баги на проде не хочется.
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Тесты целостности контента
        run: npm run test:coverage

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза. Обновление — осознанная однострочная
        # правка с новым SHA рядом с комментарием версии.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - run: npm run build

      # CSP на проде отдаёт script-src 'self' — без 'unsafe-inline'. Инлайн,
      # вернувшийся в сборку, не выполнится, и сломается это МОЛЧА уже после
      # выкатки. Поэтому проверка стоит здесь, а не в чьей-то голове.
      - name: В сборке нет инлайн-скриптов
        run: npm run check:no-inline-scripts

      # Сборка проходит и с битыми ссылками внутри страниц — проверяем явно.
      - name: Проверить ссылки и ассеты в сборке
        run: |
          cd dist
          fail=0
          for u in $(grep -oh 'href="/[^"#]*"' *.html projects/*/*.html | sed 's/href="//;s/"//' | sort -u); do
            [ -f ".$u" ] || [ -f ".${u}index.html" ] || [ -f ".${u%/}.html" ] || { echo "битая ссылка: $u"; fail=1; }
          done
          for a in $(grep -oh 'src="/[^"]*"' *.html projects/*/*.html | sed 's/src="//;s/"//' | sort -u); do
            [ -f ".$a" ] || { echo "нет файла: $a"; fail=1; }
          done
          exit $fail

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Кэшируем ровно ту версию браузера, что просит установленный Playwright:
      # иначе после обновления пакета в кэше останется несовместимый бинарник.
      - name: Версия Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # Ставим только Chromium — прогон идёт в нём одном, остальные браузеры
      # это лишние сотни мегабайт на каждый PR.
      - name: Поставить Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Системные библиотеки для Chromium
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Конфиг сам собирает проект и поднимает preview.
      - run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
