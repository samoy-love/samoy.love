name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# Минимальные права для GITHUB_TOKEN: CI только читает код. Без этого блока
# действуют настройки репозитория, и любой шаг (включая сторонние actions)
# получает тот токен, который там выставлен.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Активная LTS (24 «Krypton»). Node 22 ушёл в maintenance —
          # ловить его баги на проде не хочется.
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Тесты целостности контента
        run: npm run test:coverage

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза. Обновление — осознанная однострочная
        # правка с новым SHA рядом с комментарием версии.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - run: npm run build

      # CSP на проде отдаёт script-src 'self' — без 'unsafe-inline'. Инлайн,
      # вернувшийся в сборку, не выполнится, и сломается это МОЛЧА уже после
      # выкатки. Поэтому проверка стоит здесь, а не в чьей-то голове.
      - name: В сборке нет инлайн-скриптов
        run: npm run check:no-inline-scripts

      # Сборка проходит и с битыми ссылками внутри страниц — проверяем явно.
      - name: Проверить ссылки и ассеты в сборке
        run: |
          cd dist
          fail=0
          for u in $(grep -oh 'href="/[^"#]*"' *.html projects/*/*.html | sed 's/href="//;s/"//' | sort -u); do
            [ -f ".$u" ] || [ -f ".${u}index.html" ] || [ -f ".${u%/}.html" ] || { echo "битая ссылка: $u"; fail=1; }
          done
          for a in $(grep -oh 'src="/[^"]*"' *.html projects/*/*.html | sed 's/src="//;s/"//' | sort -u); do
            [ -f ".$a" ] || { echo "нет файла: $a"; fail=1; }
          done
          exit $fail

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Кэшируем ровно ту версию браузера, что просит установленный Playwright:
      # иначе после обновления пакета в кэше останется несовместимый бинарник.
      - name: Версия Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # Ставим только Chromium — прогон идёт в нём одном, остальные браузеры
      # это лишние сотни мегабайт на каждый PR.
      - name: Поставить Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Системные библиотеки для Chromium
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Конфиг сам собирает проект и поднимает preview.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
