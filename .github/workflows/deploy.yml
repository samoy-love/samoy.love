name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # SSH настраивается вручную, без сторонних экшенов: меньше зависимостей
      # в цепочке поставки, для одного rsync внешний экшен не нужен.
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist → server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/samoy.love/"

      # Выкатили — проверяем, что сайт действительно жив, а не «задеплоили и ушли».
      - name: Smoke-тест
        run: |
          set -e
          for path in / /projects/snakes/ /og.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://samoy.love$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::samoy.love$path вернул $code"; exit 1; }
          done
          curl -sf --max-time 15 https://samoy.love | grep -q 'og:image' \
            || { echo "::error::og:image отсутствует в выдаче"; exit 1; }

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/deploy_key
