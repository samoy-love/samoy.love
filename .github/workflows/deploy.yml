name: Deploy

# Вся механика выкатки живёт в deploy-kit — здесь только описание того,
# что именно катим и какой регресс обязан пройти.

on:
  push:
    branches: [main]
    paths-ignore:
      # Документация перечислена поимённо, а не шаблоном '**.md', и это
      # принципиально: контент сайта — тоже markdown. Файлы
      # src/content/projects/*.md Astro рендерит в страницы /projects/<slug>
      # (коллекция в src/content.config.ts, вывод в
      # src/pages/projects/[slug].astro), то есть это исходники прода, а не
      # описание проекта. Под '**.md' они попадали в игнор: правка текста
      # проекта собиралась локально, а выкатка не запускалась вовсе — и прод
      # молча оставался со старым текстом. Ошибка «не выкатили нужное» дороже
      # ошибки «выкатили лишнее», поэтому шаблон здесь запрещён: новый
      # markdown по умолчанию катится, и только заведомо документационный
      # путь добавляется в этот список руками.
      - 'README.md'
      - 'README.*.md'
      - 'CLAUDE.md'
      - 'docs/**'
      # Настройки редактора в артефакт не попадают (в dist уезжает только
      # сборка Astro) и ни в один гейт не входят: prettier в зависимостях нет,
      # .editorconfig не читает ни один из npm-скриптов.
      - '.editorconfig'
      # Описания локальных dev-серверов для агента. В dist их нет, и ни один
      # npm-скрипт их не читает: BUILD_CMD — это `astro build`, а гейт
      # добавляет к нему vitest и check:no-inline-scripts. Правка порта
      # предпросмотра не меняет ни одного байта прода.
      - '.claude/**'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Показать план, ничего не менять'
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Выкатка ходит на сервер по SSH
# секретами, токен ей нужен только для checkout — и для одной записи о
# выкатке.
#
# deployments: write — ради связи «коммит → выкатка». Deployment
# регистрируется на SHA, поэтому запись видна прямо на коммите и в разделе
# Environments репозитория: открыл коммит — сразу видно, уехал он на прод или
# нет. Сегодня этот ответ приходится собирать вручную из имени релиза
# (release-<дата>-<sha>) и списка запусков Actions.
#
# Право задаётся ЗДЕСЬ, а не только в переиспользуемом workflow:
# вызываемый workflow не может иметь прав больше, чем дал ему вызывающий, и
# `permissions: contents: read` в этом файле молча срезал бы всё остальное.
# Обратное тоже верно — само по себе это право ничего не включает, шаг
# регистрации живёт в deploy-kit. Пока его там нет, строка просто не
# используется; когда появится, править вызовы уже не придётся.
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: tr0llex/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/prod.env
      # nginx-conf не передаём: конфигурация живёт только в deploy-kit/nginx,
      # своей копии в этом репозитории нет — путь вёл в никуда.
      node-version: 24
      # Лёгкий гейт: только сборка и проверка инлайн-скриптов. Полный регресс
      # (test:coverage) уже прошёл на этом дереве в ci.yml — PR мержится
      # только зелёным, а push в main здесь идёт на смёрженный коммит,
      # который уже прогнан. Гонять vitest третий раз на том же дереве —
      # не лишняя надёжность, а лишние минуты и деньги; цифру покрытия для
      # main отдельно считает coverage.yml.
      # check:no-inline-scripts — часть гейта, а не украшение: CSP на проде
      # отдаёт script-src 'self', и вернувшийся инлайн-скрипт не выполнится.
      gates: npm ci && npm run build && npm run check:no-inline-scripts
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
