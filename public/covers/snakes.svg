  <g fill="#7be04a">
    <rect x="284" y="334" width="32" height="32" rx="8"/>
    <rect x="284" y="370" width="28" height="28" rx="7" opacity="0.8"/>
    <rect x="286" y="402" width="24" height="24" rx="6" opacity="0.6"/>
