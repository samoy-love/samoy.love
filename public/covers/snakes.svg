  <circle cx="292" cy="342" r="4" fill="#0d1510"/>
  <circle cx="306" cy="342" r="4" fill="#0d1510"/>
  <text x="150" y="90" font-family="Consolas, monospace" font-size="22" fill="#7be04a">snakes — захват территории</text>
  <text x="150" y="465" font-family="Consolas, monospace" font-size="16" fill="#5f7a63">16 игроков · боты · бинарный протокол</text>
