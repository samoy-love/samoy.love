    <rect x="370" y="150" width="90" height="90" rx="10" fill="#1b2a3d" stroke="#2b4258"/>
    <rect x="480" y="150" width="90" height="90" rx="10" fill="#1b2a3d" stroke="#2b4258"/>
    <rect x="150" y="260" width="90" height="90" rx="10" fill="#1b2a3d" stroke="#2b4258"/>
