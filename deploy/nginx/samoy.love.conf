# samoy.love — статический сайт (Astro, dist/ → /var/www/samoy.love)
# Установка: /etc/nginx/sites-available/samoy.love.conf + symlink в sites-enabled
# TLS-сертификаты выпускает certbot: certbot --nginx -d samoy.love -d www.samoy.love

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name samoy.love www.samoy.love;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://samoy.love$request_uri; }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samoy.love/privkey.pem;

    return 301 https://samoy.love$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name samoy.love;

    ssl_certificate     /etc/letsencrypt/live/samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samoy.love/privkey.pem;

    root /var/www/samoy.love;
    index index.html;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Хешированные ассеты Astro — кэш навсегда
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Шрифты и обложки
    location ~* \.(woff2?|avif|webp|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML — без кэша (деплой виден сразу)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
