# samoy.love — личная страница (Astro, статика из dist/ → /var/www/samoy.love)
#
# Этот файл описывает ТОЛЬКО server_name samoy.love и www.samoy.love.
# Соседние конфиги (launcher/metro/snakes) обслуживают свои поддомены —
# никогда не добавляйте их домены сюда и не делайте этот блок default_server.
#
# Установка:
#   sudo cp samoy.love.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/samoy.love.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат выпускается webroot-плагином (как у snakes), certbot сам nginx не правит:
#   sudo certbot certonly --webroot -w /var/www/samoy.love-acme \
#        -d samoy.love -d www.samoy.love
#
# ВНИМАНИЕ: на сервере nginx 1.24 — директива `http2 on;` (1.25+) там неизвестна,
# используется старая форма `listen 443 ssl http2;`.

server {
    listen 80;
    listen [::]:80;
    server_name samoy.love www.samoy.love;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/samoy.love-acme;
        default_type "text/plain";
    }

    location / { return 301 https://samoy.love$request_uri; }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samoy.love/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://samoy.love$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samoy.love;

    ssl_certificate     /etc/letsencrypt/live/samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samoy.love/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/samoy.love;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Хешированные ассеты Astro — кэш навсегда
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Шрифты, обложки, иконки
    location ~* \.(woff2?|avif|webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML — без кэша, деплой виден сразу
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
